name: JETOS Python/OS baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booted-python-os-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out frozen JETOS sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install native build and stdlib prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            binutils \
            pkg-config \
            libssl-dev \
            libelf-dev \
            libffi-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            liblzma-dev \
            libncurses-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            libdb-dev \
            libexpat1-dev \
            libnsl-dev \
            libtirpc-dev \
            libzstd-dev \
            tcl-dev \
            tk-dev \
            uuid-dev \
            dwarves \
            xz-utils \
            qemu-system-x86

      - name: Build and boot JETOS qualification image
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build
          set +e
          timeout 110m python3 tools/stdlib_guest.py 2>&1 | tee .build/python-os-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q 'JETOS_BASELINE_QUALIFICATION=PASS' .build/python-os-baseline.log; then
            echo 'Booted JETOS Python/OS baseline: PASS'
            exit 0
          fi
          echo "Booted JETOS Python/OS baseline: FAIL (runner status ${status})"
          exit "${status:-1}"

      - name: Upload baseline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetos-python-os-baseline-log
          path: .build/python-os-baseline.log
          if-no-files-found: warn
